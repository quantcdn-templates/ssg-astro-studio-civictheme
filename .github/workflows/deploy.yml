name: 'Deploy to QuantCDN'

on:
  push:
    branches:
      - main

# Nothing here writes to the repository; the deploy talks to QuantCDN only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Template repositories have no Quant credentials; they only verify the build.
      DEPLOY_CONFIGURED: ${{ vars.QUANT_CUSTOMER != '' && vars.QUANT_PROJECT != '' && secrets.QUANT_TOKEN != '' }}
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Restore Astro build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.astro
          key: astro-build-${{ hashFiles('src/content/**', 'public/**') }}
          restore-keys: |
            astro-build-

      - name: Restore revision log
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .quant-revision
          key: quant-revision-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            quant-revision-${{ github.ref }}-

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Deployment setup
        if: env.DEPLOY_CONFIGURED != 'true'
        run: echo 'Build verified. Deployment requires QUANT_CUSTOMER and QUANT_PROJECT variables and a QUANT_TOKEN secret.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to QuantCDN
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: quantcdn/deploy-action@9bf8cae8497ab6628d4b248db9eb11464f37e1e5 # v7.0.1
        with:
          customer: ${{ vars.QUANT_CUSTOMER }}
          project: ${{ vars.QUANT_PROJECT }}
          token: ${{ secrets.QUANT_TOKEN }}
          dir: dist
          revision-log: .quant-revision

      - name: Purge cache
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: quantcdn/purge-action@5c2a85f5318917ef12b9099cf101fe6bd75d0d06 # v7.1.0
        with:
          customer: ${{ vars.QUANT_CUSTOMER }}
          project: ${{ vars.QUANT_PROJECT }}
          token: ${{ secrets.QUANT_TOKEN }}
          url_pattern: '/*'
