name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      # The snapshot-parity oracle reads the Jest snapshots of the pinned
      # CivicTheme UI Kit checkout (git-ignored; see NOTICE.md and README).
      - name: Fetch pinned CivicTheme UI Kit
        run: |
          git init -q .upstream/uikit
          git -C .upstream/uikit remote add origin https://github.com/civictheme/uikit.git
          git -C .upstream/uikit fetch -q --depth 1 origin fe4291907b1ea15cfc0ea5d9ca47d31964a5b91a
          git -C .upstream/uikit checkout -q FETCH_HEAD
      - name: Type check and format check
        run: npm run check
      - name: Unit and parity tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Verify build output
        run: |
          test -d dist && test -f dist/index.html && echo "✓ dist present"
          grep -q "ct-" dist/_astro/*.css && echo "✓ CivicTheme CSS present"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility and behaviour tests
        run: npm run test:e2e
